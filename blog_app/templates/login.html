<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#121212;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:400px;
            background:#1f1f1f;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:5px;
            background:#2d2d2d;
            color:white;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:5px;
            background:#4CAF50;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#45a049;
        }

        .error{
            color:red;
            margin-bottom:15px;
            text-align:center;
        }
    </style>
</head>
<body>

    <div class="login-box">

        <h2>User Login</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>
        </form>

    </div>

</body>
</html>
