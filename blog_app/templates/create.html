<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .container{
            width:70%;
            max-width:800px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom:20px;
            color:#333;
        }

        .error{
            background:#ffe5e5;
            color:#d8000c;
            padding:12px;
            border-radius:6px;
            margin-bottom:20px;
            border:1px solid #ffb3b3;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#444;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:#0d6efd;
        }

        textarea{
            height:220px;
            resize:none;
        }

        .btn-group{
            margin-top:20px;
        }

        button{
            background:#0d6efd;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0b5ed7;
        }

        .back-btn{
            text-decoration:none;
            margin-left:15px;
            color:#555;
            font-weight:500;
        }

        .back-btn:hover{
            color:#000;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Create New Blog Post</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Blog Title</label>
            <input type="text" name="title" placeholder="Enter blog title">
        </div>

        <div class="form-group">
            <label>Blog Content</label>
            <textarea name="body" placeholder="Write your blog here..."></textarea>
        </div>

        <div class="btn-group">
            <button type="submit">Publish Post</button>
            <a href="/" class="back-btn">← Back to Home</a>
        </div>

    </form>

</div>

</body>
</html>
